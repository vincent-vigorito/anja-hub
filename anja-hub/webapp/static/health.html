<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anja · Self-Health</title>
<style>
  :root { --bg:#f7fafc; --card:#ffffff; --line:#e3e8ee; --fg:#1a1f36; --mut:#697386;
          --ok:#16a34a; --warn:#f59e0b; --err:#e11d48; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,system-ui,sans-serif; padding:24px; }
  h1 { font-size:18px; margin:0 0 4px; } .sub { color:var(--mut); font-size:12px; margin-bottom:20px; }
  .badge { display:inline-block; padding:4px 12px; border-radius:20px; font-weight:600; font-size:13px; }
  .b-ok { background:rgba(95,184,122,.15); color:var(--ok); } .b-degraded { background:rgba(224,177,95,.15); color:var(--warn); }
  .b-error { background:rgba(224,122,95,.15); color:var(--err); }
  .card { background:var(--card); border:1px solid #ebeff3; border-radius:8px; padding:8px 16px; margin-top:16px; box-shadow:0 2px 5px 0 rgba(18,42,66,.04), 0 0 0 1px rgba(18,42,66,.06); }
  .chk { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .chk:last-child { border-bottom:0; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .d-ok { background:var(--ok); } .d-warn { background:var(--warn); } .d-error { background:var(--err); }
  .nm { font-variant-numeric:tabular-nums; min-width:200px; font-weight:500; }
  .dt { color:var(--mut); font-size:13px; }
  .muted { color:var(--mut); font-size:12px; } a { color:#0b887b; }
</style>
</head>
<body>
  <h1>ᛗ Self-Health</h1>
  <div class="sub">M-SelfHealth · stato dell'always-on (daemon · MCP · index · provider · disco) — <span id="ts"></span></div>
  <div>Stato: <span id="status" class="badge">…</span></div>
  <div class="card" id="checks"></div>
  <p class="muted" style="margin-top:20px"><a href="/">← Mission Control</a> · <a href="/costs">Costi →</a> · gli alert sul degrado arrivano nel Bell (notification bus)</p>

<script>
const $ = s => document.querySelector(s);
const SEV = { ok:"d-ok", warn:"d-warn", error:"d-error" };
async function load() {
  const r = await fetch("/api/health/self").then(x => x.json()).catch(() => null);
  if (!r) { $("#status").textContent = "errore"; return; }
  $("#ts").textContent = (r.ts || "").replace("T", " ").replace("+00:00", " UTC");
  const st = $("#status");
  st.textContent = r.status; st.className = "badge b-" + r.status;
  const esc = s => (s==null?"":String(s)).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
  $("#checks").innerHTML = (r.checks || []).map(c =>
    `<div class="chk"><span class="dot ${SEV[c.severity]||'d-ok'}"></span>`
    + `<span class="nm">${esc(c.name)}</span><span class="dt">${esc(c.detail)}</span></div>`).join("");
}
load(); setInterval(load, 10000);
</script>
</body>
</html>
